name: Deploy Client to Cloudflare Pages

on:
  workflow_run:
    workflows: ['CI']
    types:
      - completed

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build client
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: bun run build

      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          bunx wrangler pages deploy dist --project-name "${{ secrets.CLOUDFLARE_PAGES_PROJECT }}" | tee /tmp/wrangler-pages-deploy.log

      - name: Print deployed URL
        run: |
          DEPLOY_URL=$(grep -Eo 'https://[a-zA-Z0-9./_-]+\.pages\.dev[^ ]*' /tmp/wrangler-pages-deploy.log | tail -n 1 || true)
          if [ -n "$DEPLOY_URL" ]; then
            echo "Cloudflare Pages deployment URL: $DEPLOY_URL"
          else
            echo 'Cloudflare Pages deployment finished, but no pages.dev URL was detected in wrangler output.'
          fi
