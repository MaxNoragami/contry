services:
  db:
    image: postgres:17-alpine
    container_name: contry-postgres
    restart: unless-stopped
    profiles: ["dev", "prod"]
    env_file:
      - ${CONTRY_ENV_FILE:-.env.dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: contry-server
    restart: unless-stopped
    profiles: ["dev", "prod"]
    env_file:
      - ${CONTRY_ENV_FILE:-.env.dev}
    environment:
      ConnectionStrings__Database: ${DOCKER_ConnectionStrings__Database}
      Cors__AllowedOriginsCsv: ${DOCKER_Cors__AllowedOriginsCsv}
      AuthCookies__Domain: ${DOCKER_AuthCookies__Domain}
      AuthCookies__SecurePolicy: ${DOCKER_AuthCookies__SecurePolicy}
      ASPNETCORE_URLS: http://+:${ASPNETCORE_HTTP_PORT:-8080}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${ASPNETCORE_HTTP_PORT:-8080}:${ASPNETCORE_HTTP_PORT:-8080}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${ASPNETCORE_HTTP_PORT:-8080}/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_API_BASE_URL: ${DOCKER_VITE_API_BASE_URL:-/}
    container_name: contry-client
    restart: unless-stopped
    profiles: ["dev", "prod"]
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${CLIENT_HTTP_PORT:-5173}:80"

volumes:
  postgres-data:
